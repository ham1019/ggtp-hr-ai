name: Publish LMS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Validate JavaScript
        run: node --check 공통/lms.js
      - name: Prepare public files
        shell: python
        run: |
          from pathlib import Path
          import shutil
          output = Path('_site')
          for source, target in [('01_ChatGPT_Work', 'day1'), ('02_Antigravity', 'day2')]:
              (output / target).mkdir(parents=True, exist_ok=True)
              html = (Path(source) / 'index.html').read_text(encoding='utf-8')
              (output / target / 'index.html').write_text(html.replace('../공통/', '../assets/'), encoding='utf-8')
          assets = output / 'assets'
          assets.mkdir()
          for name in ['lms.css', 'lms.js', 'mcp-connections.png', 'context-engineering.png', '회의전사_260922_1차.txt', '회의전사_261006_2차.txt', '261020_업무보고서_교육용템플릿_draft.html']:
              shutil.copyfile(Path('공통') / name, assets / name)
          script = assets / 'lms.js'
          text = script.read_text(encoding='utf-8').replace('../공통/', '../assets/').replace('../01_ChatGPT_Work/index.html', '../day1/').replace('../02_Antigravity/index.html', '../day2/')
          script.write_text(text, encoding='utf-8')
          (output / 'index.html').write_text('<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>경기테크노파크 AI 실무교육</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:80px auto;padding:24px;line-height:1.8;color:#182b45}a{display:block;padding:24px;margin:20px 0;background:#edf3ff;border-radius:12px;color:#225ed9;text-decoration:none}</style><h1>경기테크노파크 AI 실무교육</h1><a href="day1/">1일차 · ChatGPT Work</a><a href="day2/">2일차 · Antigravity</a></html>', encoding='utf-8')
          assert len(list(output.rglob('*.*'))) == 10
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
